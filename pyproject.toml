[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webscraper"
dynamic = ["version"]  # single source of truth: webscraper/__init__.py
description = "Keyword-driven web scraper with staging and permanent storage"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
webscraper = "webscraper.cli:main"

[tool.setuptools.dynamic]
version = { attr = "webscraper.__version__" }

[tool.setuptools.packages.find]
include = ["webscraper*"]

[tool.setuptools.package-data]
webscraper = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
