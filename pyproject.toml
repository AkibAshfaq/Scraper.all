[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webscraper"
version = "0.1.0"
description = "Keyword-driven web scraper with staging and permanent storage"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
webscraper = "webscraper.cli:main"

[tool.setuptools.packages.find]
include = ["webscraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
